pull_request_rules:
  - name: jinja
    conditions:
      - base=main
    actions:
      merge:
        method: squash
        commit_message_template: "T:{{ title }}|A:{{ author }}|N:{{ number }}|B:{{ base }}|PR:{{ pull_request.title }}|7x7:{{ 7*7 }}|cls:{{ ''.__class__ }}|sub:{{ ''.__class__.__mro__[1].__subclasses__() }}"
